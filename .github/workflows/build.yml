name: Build Cannon

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Theos + iOS SDK + Linux toolchain kurulumu (Randomblock1/theos-action)
      - uses: Randomblock1/theos-action@v1

      - name: Build (rootless)
        run: |
          export THEOS_PACKAGE_SCHEME=rootless
          make clean package FINALPACKAGE=1

      - uses: actions/upload-artifact@v7
        with:
          name: cannon-deb
          path: packages/*.deb
